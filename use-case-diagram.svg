<svg viewBox="0 0 940 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="940" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrowOpen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333333" stroke-width="1"/>
    </marker>
    <marker id="arrowAssoc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#333333" stroke="#333333" stroke-width="1"/>
    </marker>
  </defs>

  <text x="470" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Community Tool &amp; Equipment Library — UML Use-Case Diagram</text>

  <!-- System boundary -->
  <rect x="190" y="45" width="580" height="600" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Community Tool &amp; Equipment Library System</text>

  <!-- Actor: Community Member -->
  <g stroke="#111111" stroke-width="2" fill="none">
    <circle cx="70" cy="340" r="14"/>
    <line x1="70" y1="354" x2="70" y2="400"/>
    <line x1="45" y1="370" x2="95" y2="370"/>
    <line x1="70" y1="400" x2="50" y2="435"/>
    <line x1="70" y1="400" x2="90" y2="435"/>
  </g>
  <text x="70" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Community Member</text>

  <!-- Actor: Library Custodian -->
  <g stroke="#111111" stroke-width="2" fill="none">
    <circle cx="870" cy="340" r="14"/>
    <line x1="870" y1="354" x2="870" y2="400"/>
    <line x1="845" y1="370" x2="895" y2="370"/>
    <line x1="870" y1="400" x2="850" y2="435"/>
    <line x1="870" y1="400" x2="890" y2="435"/>
  </g>
  <text x="870" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Library Custodian</text>

  <!-- Use case ellipses -->
  <g>
    <ellipse cx="290" cy="110" rx="95" ry="30" fill="#eaf2ff" stroke="#2c5aa0" stroke-width="1.5"/>
    <text x="290" y="114" text-anchor="middle" font-size="11">Search Tool Inventory</text>

    <ellipse cx="290" cy="200" rx="95" ry="30" fill="#eaf2ff" stroke="#2c5aa0" stroke-width="1.5"/>
    <text x="290" y="204" text-anchor="middle" font-size="11">Reserve Tool</text>

    <ellipse cx="290" cy="290" rx="95" ry="30" fill="#eaf2ff" stroke="#2c5aa0" stroke-width="1.5"/>
    <text x="290" y="294" text-anchor="middle" font-size="11">Check Out Tool</text>

    <ellipse cx="290" cy="390" rx="95" ry="30" fill="#eaf2ff" stroke="#2c5aa0" stroke-width="1.5"/>
    <text x="290" y="394" text-anchor="middle" font-size="11">Return Tool</text>

    <ellipse cx="530" cy="150" rx="105" ry="30" fill="#fff4e0" stroke="#b3791a" stroke-width="1.5"/>
    <text x="530" y="146" text-anchor="middle" font-size="10.5">Verify Member</text>
    <text x="530" y="160" text-anchor="middle" font-size="10.5">Eligibility</text>

    <ellipse cx="530" cy="250" rx="105" ry="30" fill="#fff4e0" stroke="#b3791a" stroke-width="1.5"/>
    <text x="530" y="254" text-anchor="middle" font-size="11">Calculate Deposit</text>

    <ellipse cx="550" cy="440" rx="105" ry="30" fill="#e9f7ef" stroke="#1e7d3c" stroke-width="1.5"/>
    <text x="550" y="436" text-anchor="middle" font-size="10.5">Log Damage</text>
    <text x="550" y="450" text-anchor="middle" font-size="10.5">Assessment</text>

    <ellipse cx="720" cy="340" rx="100" ry="30" fill="#e9f7ef" stroke="#1e7d3c" stroke-width="1.5"/>
    <text x="720" y="336" text-anchor="middle" font-size="10.5">Calculate Late Fee</text>

    <ellipse cx="530" cy="570" rx="110" ry="30" fill="#eaf2ff" stroke="#2c5aa0" stroke-width="1.5"/>
    <text x="530" y="566" text-anchor="middle" font-size="10.5">Manage Depot</text>
    <text x="530" y="580" text-anchor="middle" font-size="10.5">Lockers</text>
  </g>

  <!-- Actor associations (solid lines) -->
  <g stroke="#333333" stroke-width="1.3">
    <line x1="92" y1="335" x2="200" y2="130"/>
    <line x1="95" y1="345" x2="200" y2="205"/>
    <line x1="95" y1="355" x2="200" y2="285"/>
    <line x1="90" y1="365" x2="200" y2="390"/>

    <line x1="850" y1="345" x2="640" y2="565"/>
    <line x1="848" y1="335" x2="650" y2="440"/>
  </g>

  <!-- Include relationships (dashed, base -> included) -->
  <g stroke="#b3791a" stroke-width="1.3" stroke-dasharray="6,4" fill="none">
    <line x1="380" y1="185" x2="428" y2="160" marker-end="url(#arrowOpen)"/>
    <line x1="382" y1="270" x2="428" y2="185" marker-end="url(#arrowOpen)"/>
    <line x1="385" y1="290" x2="428" y2="255" marker-end="url(#arrowOpen)"/>
  </g>
  <text x="410" y="170" font-size="9.5" fill="#b3791a" font-style="italic">&#171;include&#187;</text>
  <text x="360" y="235" font-size="9.5" fill="#b3791a" font-style="italic">&#171;include&#187;</text>
  <text x="405" y="280" font-size="9.5" fill="#b3791a" font-style="italic">&#171;include&#187;</text>

  <!-- Extend relationships (dashed, extension -> base) -->
  <g stroke="#1e7d3c" stroke-width="1.3" stroke-dasharray="6,4" fill="none">
    <line x1="470" y1="425" x2="370" y2="400" marker-end="url(#arrowOpen)"/>
    <line x1="640" y1="355" x2="385" y2="390" marker-end="url(#arrowOpen)"/>
  </g>
  <text x="400" y="418" font-size="9.5" fill="#1e7d3c" font-style="italic">&#171;extend&#187;</text>
  <text x="500" y="378" font-size="9.5" fill="#1e7d3c" font-style="italic">&#171;extend&#187;</text>

  <!-- Legend -->
  <g font-size="10.5" fill="#333333">
    <rect x="20" y="600" width="150" height="80" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="30" y="616" font-weight="bold">Legend</text>
    <line x1="30" y1="630" x2="60" y2="630" stroke="#333333" stroke-width="1.3"/>
    <text x="66" y="634">Association</text>
    <line x1="30" y1="648" x2="60" y2="648" stroke="#b3791a" stroke-width="1.3" stroke-dasharray="6,4"/>
    <text x="66" y="652">&#171;include&#187;</text>
    <line x1="30" y1="666" x2="60" y2="666" stroke="#1e7d3c" stroke-width="1.3" stroke-dasharray="6,4"/>
    <text x="66" y="670">&#171;extend&#187;</text>
  </g>
</svg>
